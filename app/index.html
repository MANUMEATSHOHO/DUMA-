<style>
:root{
  --desk:#000000; --desk-2:#000000; --paper:#c9ced9; --paper-2:#b6bdd0; --ink:#0c1633; --ink-2:#4a5878; --rule:#98a2bd;
  --blue:#00318f; --red:#b0282e; --stamp:#b0282e; --bad:#b0282e; --good:#2e9e57; --warn:#7f94cc; --hl:#d0d6e6;

}

  }
}
:root[data-theme="dark"]{
  --desk:#000000; --desk-2:#000000; --paper:#0c1a3d; --paper-2:#162552; --ink:#eef2ff; --ink-2:#a9b6dc; --rule:#25356a;
  --blue:#5e88e6; --red:#c8454d; --stamp:#c8454d; --bad:#c8454d; --good:#4fcf7a; --warn:#7d8fc4; --hl:#122150;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box}
body{overflow-anchor:none;margin:0;background:var(--desk);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;min-height:calc(var(--vh1,1vh)*100);
  }
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.sheet{background:var(--paper);border:1px solid var(--rule);border-top:4px solid var(--blue);border-radius:3px;padding:12px 14px;box-shadow:0 1px 0 rgba(0,0,0,.35),0 10px 22px rgba(0,0,0,.28)}

.muted{color:var(--ink-2)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* top */
.top{max-width:1380px;margin:0 auto;padding:12px 12px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--disp);font-size:26px;letter-spacing:.04em;color:#fff;line-height:1}
.logo::after{content:'';display:block;width:84px;height:9px;margin-top:6px;background:linear-gradient(90deg,#c9ced9 0 33.3%,#00318f 33.3% 66.6%,#b0282e 66.6%);border:1px solid rgba(255,255,255,.6)}
.flagbar{height:12px;background:linear-gradient(#c9ced9 0 33.3%,#00318f 33.3% 66.6%,#b0282e 66.6%)}
.logo small{display:block;font-family:var(--body);font-size:12px;letter-spacing:0;color:#b9c8ee;margin-top:4px;order:2}
.weekpill{margin-left:auto;display:flex;align-items:center;gap:10px;color:#eef2ff}

.weekbar i.on{background:#b0282e}
.weekbar i.now{background:#c9ced9}
.tbtn{background:transparent;border:1px solid rgba(255,255,255,.45);color:#eef2ff;padding:5px 10px;border-radius:3px;font-size:13px}
.tbtn:hover{background:rgba(255,255,255,.1)}

.grid{max-width:1380px;margin:0 auto;padding:12px;display:grid;gap:12px;grid-template-columns:292px minmax(0,1fr) 352px;align-items:start}

/* resources */
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px}
.res div b{display:block;font-size:20px;font-weight:600}
.dots{display:flex;gap:5px;margin-top:3px}
.dots i{width:16px;height:16px;border:2px solid var(--ink);display:block;border-radius:50%}
.dots i.on{background:var(--ink)}
.meter{margin:9px 0}
.meter .l{display:flex;justify-content:space-between;font-size:14px}
.bar{height:9px;background:var(--paper-2);position:relative;margin-top:3px;border:1px solid var(--rule)}
.bar i{display:block;height:100%;background:var(--c,var(--good))}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.bar.lo i{background:var(--bad)}.bar.mid i{background:var(--warn)}.bar.hi i{background:var(--good)}
.dir{border-left:6px solid var(--red);padding-left:10px}

.ok{color:var(--good)}.no{color:var(--bad)}

.endbtn{width:100%;margin-top:12px;background:var(--red);color:#fff;border:0;border-radius:3px;padding:12px;font-family:var(--disp);font-size:15px;letter-spacing:.03em}
:root[data-theme="dark"] .endbtn{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .endbtn{color:#fff}}
.endbtn:hover{filter:brightness(1.1)}

/* tabs */
.tabs{display:flex;gap:2px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:var(--desk-2);color:#d3dcf5;border:1px solid rgba(255,255,255,.22);padding:8px 14px;border-radius:3px 3px 0 0}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--rule);border-top:4px solid var(--red);font-weight:600}

/* ledger */
.ledger{width:100%;border-collapse:collapse;font-size:14px}
.ledger th{text-align:left;font-weight:600;font-size:13px;color:var(--ink-2);padding:4px 6px;border-bottom:2px solid var(--ink)}

.ledger .nm{font-weight:500}
.ledger .gv{font-size:12px;color:var(--ink-2)}
.ledger .mini{width:62px}
.tdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.wrapx{overflow-x:auto}

.flag{font-size:12px;border:1px solid var(--bad);color:var(--bad);padding:0 5px;border-radius:2px;margin-left:5px;white-space:nowrap}

/* towers */
.tw{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.tw .sheet+.sheet{margin-top:0}
.tw .tcard{border-top:2px solid var(--tc)}
.tw h3{font-size:16px;font-weight:600}
.tw .lead{font-size:13px;color:var(--ink-2)}
.tw .ask{margin:8px 0;padding:6px 8px;background:var(--hl);border:1px dashed var(--rule);font-size:13px}
.tw .int{font-size:13px;margin:6px 0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ab{background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;padding:6px 10px;text-align:left;font-size:13px;line-height:1.3}
.ab:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.ab:disabled{opacity:.45;cursor:not-allowed;border-color:var(--rule)}
.ab .c{display:block;font-size:12px;opacity:.8}
.ab.pri{background:var(--ink);color:var(--paper)}
.ab.pri{background:var(--red);border-color:var(--red);color:#fff}
.ab.pri:hover:not(:disabled){background:var(--blue);border-color:var(--blue);color:#fff}

/* party rows */
.prow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.prow:last-child{border-bottom:0}
.prow h3{font-size:15px;font-weight:600}
.prow .btns{margin-top:6px}
.box{width:20px;height:20px;border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;line-height:1}

.pv{font-size:20px;font-weight:600;text-align:right}

.arow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule)}
.arow:last-child{border-bottom:0}
.arow .tx{min-width:0}
.arow .tx b{font-weight:600}

/* forecast ballot */
.ballot{border:2px solid var(--blue);border-top:6px solid var(--red);padding:10px 12px;background:var(--paper)}
.ballot h2{font-size:15px;font-weight:600;margin-bottom:6px}
.brow{display:grid;grid-template-columns:20px 24px 1fr 48px;gap:8px;align-items:center;margin:7px 0}
.brow .nm{font-size:13px;line-height:1.2}
.track{position:relative;height:11px;background:var(--paper-2);margin-top:3px}
.track i{display:block;height:100%;background:var(--c)}
.track::after{content:'';position:absolute;left:var(--bar);top:-4px;bottom:-4px;border-left:2px dashed var(--ink)}
.bv{text-align:right;font-weight:600;font-size:14px}
.sq{width:14px;height:14px;border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.sq.on::after{content:'✓';color:var(--stamp)}
.leg{font-size:12px;color:var(--ink-2);margin-top:2px}
.seatline{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:14px}
.seatline b{font-size:22px;font-weight:600}
svg.hemi{width:100%;height:auto;display:block;margin-top:6px}
.tgt{margin-top:8px;font-size:13px}
.tgt .bar{margin-top:4px}

/* log */
.logl{max-height:220px;overflow:auto;font-size:13px}
.logl p{padding:4px 0;border-bottom:1px solid var(--rule)}
.logl p b{color:var(--ink-2);font-weight:500}

/* modal */
#modal:empty{display:none}
.ov{position:fixed;inset:0;background:rgba(5,12,10,.72);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px max(16px,env(safe-area-inset-bottom,0px));z-index:20}
.card{background:var(--paper);border:2px solid var(--blue);border-top:8px solid var(--red);max-width:640px;width:100%;padding:20px 22px;margin:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.card h2{font-family:var(--disp);color:var(--blue);font-size:20px;line-height:1.25;margin-bottom:10px;letter-spacing:.01em}
.card p{margin:8px 0}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;padding:10px 12px;margin-top:8px}

.opt .eff{display:block;font-size:12.5px;opacity:.8;margin-top:3px}

.who{font-size:13px;color:var(--ink-2);margin-bottom:6px}

.rg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:10px 0}

.rg div{font-size:13px}
.ur{margin:10px 0;padding:8px 10px;border:1px dashed var(--rule)}
.ur li{margin:3px 0}
ul.cl2{margin:6px 0;padding-left:20px}


/* emblems */
.emb{width:28px;height:32px;flex:none;display:block}
.emb.big{width:46px;height:53px}
.pemb,.temb{width:44px;height:44px;flex:none;display:block;border-radius:9px;overflow:hidden}
.pemb.sm{width:24px;height:24px;border-radius:5px}
.rn{display:flex;align-items:center;gap:9px}
.rn .nm{display:inline}
.ledger .mini{width:62px}
.rhead{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.rhead h2{margin:0}
/* tower cards: each tower has its own look */
.tcard{padding:0;overflow:hidden;border:2px solid var(--tc);border-top:2px solid var(--tc)}

.thead h3{font-size:16px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.65)}
.thead .lead{font-size:12.5px;color:rgba(255,255,255,.95);text-shadow:0 1px 2px rgba(0,0,0,.65)}
.tstrip{height:7px;background:var(--tstrip)}

.phead .pv{background:rgba(10,14,28,.5);padding:3px 10px;border-radius:4px}
.tbody{padding:12px 14px}
.tbody .meter{margin-top:0}
.t-pol{--tc:#00318f;--tp:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 2px,transparent 2px 16px);--tstrip:linear-gradient(90deg,#c9ced9 0 33.3%,#00318f 33.3% 66.6%,#b0282e 66.6%)}

.t-vpk{--tc:#46515c;--tp:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px);--ts2:100% 9px;--tstrip:repeating-linear-gradient(-45deg,#e0a800 0 8px,#1b1b1b 8px 16px)}

/* party cards */
.pcard{padding:0;overflow:hidden;border:2px solid var(--pc);border-top:2px solid var(--pc);margin-top:12px}
.pcard:first-of-type{margin-top:0}
.phead{display:flex;align-items:center;gap:12px;padding:10px 14px;color:#fff;background-color:var(--pc);background-image:var(--pp);background-size:var(--pz,auto)}

.phead .sub2{font-size:12.5px;color:rgba(255,255,255,.95);text-shadow:0 1px 2px rgba(0,0,0,.65)}

/* black + red theme */
.sheet:not(.tcard):not(.pcard){border-top-color:var(--red)}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.top .tl{color:#b9b9c4;font-size:13px}
.logo{display:flex;align-items:center;gap:16px;font-size:34px;justify-content:center}
.logo::after{display:none}

.weekpill{margin-left:0;justify-self:end}

function rnd(){S.rs=(S.rs+0x6D2B79F5)|0;let t=Math.imul(S.rs^(S.rs>>>15),1|S.rs);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}
function alloc(n,w){const sum=w.reduce((a,b)=>a+b,0)||1;const q=w.map(x=>x/sum*n);const a=q.map(Math.floor);const rem=n-a.reduce((x,y)=>x+y,0);const o=q.map((x,i)=>[x-a[i],i]).sort((p,q2)=>q2[0]-p[0]);for(let k=0;k<rem;k++)a[o[k][1]]++;return a}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---- effects ---- */
const RK={ar:'штаб',mood:'настроение',camp:'агитация',mob:'мобилизация',des:'ДЭГ',prog:'программы'};
function setR(r,k,v){
  if(k==='des')r.des=clamp(r.des+v,0,desCap());
  else if(k==='prog')r.prog+=v;
  else r[k]=clamp(r[k]+v,0,100);
}
function applyFx(f0){
  const f=JSON.parse(JSON.stringify(f0));const notes=[];
  if(S.sanc>0&&((f.noise||0)>0||(f.loy&&Object.values(f.loy).some(v=>v<0)))){
    S.sanc--;if(f.noise>0)f.noise=0;
    if(f.loy)for(const k in f.loy)if(f.loy[k]<0)f.loy[k]=Math.ceil(f.loy[k]/2);
    notes.push('санкция Куратора сняла часть последствий');
  }
  if(f.trust)S.trust=clamp(S.trust+f.trust,0,100);
  if(f.budget)S.budget+=f.budget;
  if(f.lev)S.lev=clamp(S.lev+f.lev,0,15);
  if(f.noise)S.noise=clamp(S.noise+f.noise,0,100);
  if(f.chron){S.chron=Math.max(0,S.chron+f.chron);S.noise=clamp(S.noise+(f.chron>0?f.chron:0),0,100)}
  if(f.loy)for(const k in f.loy)S.towers[k].loy=clamp(S.towers[k].loy+f.loy[k],0,100);
  if(f.mood)S.regions.forEach(r=>setR(r,'mood',f.mood));
  if(f.turn)S.natTurn+=f.turn;
  if(f.er)S.natEr+=f.er;
  if(f.party)for(const p in f.party)S.pb[p]=clamp(S.pb[p]+f.party[p],-4,4);
  if(f.reg)for(const id in f.reg)for(const k in f.reg[id])setR(R(id),k,f.reg[id][k]);
  if(f.regT)for(const ty in f.regT)S.regions.filter(r=>r.type===ty).forEach(r=>{for(const k in f.regT[ty])setR(r,k,f.regT[ty][k])});
  if(f.regAll)S.regions.forEach(r=>{for(const k in f.regAll)setR(r,k,f.regAll[k])});
  if(f.regX)for(const id in f.regX){const r=R(id),x=f.regX[id];if(x.turn)r.tb=(r.tb||0)+x.turn;if(x.party){r.pb=r.pb||{};for(const p in x.party)r.pb[p]=(r.pb[p]||0)+x.party[p]}}
  if(f.gru)S.gru=f.gru==='allowed'?'allowed':f.gru;
  if(f.flag)S.flags[f.flag]=true;
  return {f,notes};
}
function fxText(f){
  const a=[];
  if(f.trust)a.push('Доверие Администрации '+sgn(f.trust));
  if(f.budget)a.push('Бюджет '+sgn(f.budget));
  if(f.lev)a.push('Рычаги '+sgn(f.lev));
  if(f.noise)a.push('Шум '+sgn(f.noise));
  if(f.loy)for(const k in f.loy)a.push(TW[k].s+' '+sgn(f.loy[k]));
  if(f.mood)a.push('Настроение везде '+sgn(f.mood));
  if(f.turn)a.push('Явка '+sgn(f.turn,1)+' п.п.');
  if(f.er)a.push('ЕР '+sgn(f.er,1)+' п.п.');
  if(f.party)for(const p in f.party)a.push(PN[p]+' '+sgn(f.party[p],1));
  if(f.reg)for(const id in f.reg){const n=REG0.find(r=>r.id===id).name;for(const k in f.reg[id])a.push(n+': '+RK[k]+' '+sgn(f.reg[id][k]))}
  if(f.regT)for(const ty in f.regT)for(const k in f.regT[ty])a.push('Тип «'+TYPES[ty]+'»: '+RK[k]+' '+sgn(f.regT[ty][k]));
  if(f.regX)for(const id in f.regX){const n=REG0.find(r=>r.id===id).name,x=f.regX[id];if(x.turn)a.push(n+': явка '+sgn(x.turn,1)+' п.п.');if(x.party)for(const p in x.party)a.push(n+': '+PN[p]+' '+sgn(x.party[p],1))}
  if(f.regAll)for(const k in f.regAll)a.push('Все регионы: '+RK[k]+' '+sgn(f.regAll[k]));
  if(f.gru==='allowed')a.push('«Яблоко» в бюллетене');
  if(f.gru==='refused')a.push('«Яблоко» не допущено');
  if(f.gru==='struck')a.push('«Яблоко» снято с выборов');
  return a.join('; ');
}

/* ---- election maths ---- */
function turnoutOf(r){
  return clamp(r.bt+S.natTurn+.06*(r.ar-45)+.035*r.camp+.08*r.mob+2.2*r.des+(r.early?2.5:0)+(S.rules.three?3:0)+.05*(r.mood-55)-2+(r.tb||0),22,97);
}
function sharesOf(r,sigma){
  const s={};['er','kp','ld','nl','sr','ot'].forEach(p=>s[p]=r.base[p]+S.pb[p]+((r.pb&&r.pb[p])||0)+((S.nuB&&S.nuB[p])||0));
  const sh=clamp((55-r.mood)*.06,-2,4);
  s.er+=.085*(r.ar-45)+.045*r.camp+.9*r.des+.035*r.mob+S.natEr-(r.obs?1:0)-sh-3;
  s.kp+=sh*.35-(r.id==='alt'?1.6:.8)*r.des;s.nl+=sh*.35;s.ld+=sh*.3;
  s.gr=0;
  if(S.gru==='allowed'){
    const g=Math.max(.5,1.6+.16*r.base.nl+S.pb.gr+((r.pb&&r.pb.gr)||0)+((S.nuB&&S.nuB.gr)||0));s.gr=g;
    s.nl-=g*.5;s.ot-=g*.2;s.kp-=g*.15;s.er-=g*.15;
  }
  if(sigma)for(const p in s)s[p]+=(rnd()-.5)*2*sigma*(p==='er'?1.4:.7);
  let tot=0;for(const p in s){s[p]=Math.max(.3,s[p]);tot+=s[p]}
  for(const p in s)s[p]=s[p]/tot*100;
  return s;
}
function forecast(sigma){
  const regs=S.regions.map(r=>({r,t:clamp(turnoutOf(r)+(sigma?(rnd()-.5)*2*sigma*1.5:0),20,98),sh:sharesOf(r,sigma)}));
  const votes={};PARTIES.forEach(p=>votes[p]=0);let tot=0,vt=0;
  regs.forEach(o=>{const v=o.r.voters*o.t/100;tot+=v;vt+=o.r.voters;PARTIES.forEach(p=>votes[p]+=v*o.sh[p]/100)});
  const nat={};PARTIES.forEach(p=>nat[p]=votes[p]/tot*100);
  const turn=tot/vt*100;
  const pass=PARTIES.filter(p=>nat[p]>=5);
  const la=alloc(225,pass.map(p=>nat[p]));
  const list={};PARTIES.forEach(p=>list[p]=0);pass.forEach((p,i)=>list[p]=la[i]);
  const smd={};PARTIES.forEach(p=>smd[p]=0);
  const byId={};
  regs.forEach(o=>{
    byId[o.r.id]=o;
    const w=PARTIES.map(p=>Math.pow(o.sh[p],2.4)*(p==='er'?(1+.006*(o.r.ar-45)+(S.rules.smd?.12:0)):1));
    const a=alloc(o.r.smd,w);PARTIES.forEach((p,i)=>smd[p]+=a[i]);
  });
  const seats={};PARTIES.forEach(p=>seats[p]=list[p]+smd[p]);
  return {regs,byId,nat,turn,pass,list,smd,seats};
}

/* ---- action model ---- */
function why(a){
  if(a.na)return a.na;
  if(a.k&&S.mode&&S.mode.dh&&S.dhu&&S.dhu[a.k])return 'единоразово: уже использовано';
  if(a.free)return '';
  if(UI.wild)return a.na||'';
  if(S.ap<(a.ap||0))return 'нет действий';
  if(S.budget<cB(a))return 'мало бюджета';
  if(S.lev<cL(a))return 'мало рычагов';
  return '';
}
function perform(a){
  if(S.phase!=='play'||why(a))return;
  if(!a.free&&!UI.wild){S.ap-=a.ap||0;S.budget-=cB(a);S.lev-=cL(a)}
  if(a.k&&!a.free&&S.mode&&S.mode.dh)(S.dhu||(S.dhu={}))[a.k]=1;
  if(!a.free){const st=ST();st.act++;st.byT[a.t]=(st.byT[a.t]||0)+1}
  a.run();
  chk();
  if(UI.hard&&a.elite){const sfx=' Недовольство граждан растёт: настроение −1,5.';applyFx({mood:-1.5});if(S.log[0])S.log[0].t+=sfx;TOAST=(TOAST||'')+sfx}
  save();render();
}
function chips(a){
  const c=[];
  if(a.free)return a.d||'';
  if(a.ap)c.push(a.ap+' дейст.');
  if(a.b)c.push(cB(a)+' млрд');
  if(a.l)c.push(cL(a)+' рыч.');
  return (a.d?a.d+(c.length?' · ':''):'')+c.join(', ');
}
function btn(a,cls){
  const w=why(a);
  const i=REGF.push(()=>perform(a))-1;
  return `<button class="ab ${cls||''}" data-r="${i}" ${w?'disabled':''} title="${esc(w||a.h||'')}">${esc(a.t)}<span class="c">${esc(w?w:chips(a))}</span></button>`;
}

function pickEvent(){
  const sid=SCHEDULE[S.week];
  if(sid)return {kind:'week',id:sid};
  let id;
  while(S.deck.length){id=S.deck.shift();if(!EV[id].a||EV[id].a())return {kind:'week',id};}
  return {kind:'week',id:'r_pol'};
}
function startWeek(){
  S.dlLeft=60000;
  S.ap=apCap();S.erW=forecast(0).nat.er;S.budget+=10;S.lev=Math.min(15,S.lev+2);S.dirI=S.week-1;
  TORD.forEach(t=>S.towers[t].mw=0);
  S.ev=pickEvent();S.phase='event';
  say(`Неделя ${S.week}. Поступление в бюджет: +10 млрд, рычаги +2.`);
}
function chooseOpt(i){
  const ev=EV[S.ev.id],o=ev.o[i];
  const r=applyFx(o.fx||{});
  const txt=fxText(r.f);
  S.evRes={t:o.t,fx:txt,notes:r.notes};
  say(ev.t+': «'+o.t+'»'+(txt?' ('+txt+')':''));
  ST().evN=(ST().evN||0)+1;chk();
  S.phase='evres';save();render();
}
function afterRes(){
  if(S.ev.kind==='day'){
    if(S.day<3){S.day++;S.ev={kind:'day',id:'d'+S.day};S.phase='event'}
    else finishElection();
  }else S.phase='play';
  save();render();
}

function endWeek(){
  const F=forecast(0),rep={lines:[]};
  const D=DIRS[S.dirI],ok=D.c(F);
  S.trust=clamp(S.trust+(ok?6:-7),0,100);
  if(ok)ST().dirOk=(ST().dirOk||0)+1;
  rep.lines.push({ok,t:'Установка Куратора: «'+D.t+'» — '+(ok?'выполнена (доверие +6)':'не выполнена (доверие −7)')});
  TORD.forEach(t=>{
    const T=S.towers[t];let d=TWD[t][T.di%3],g=0;
    while(d.a&&!d.a()&&g<3){T.di++;d=TWD[t][T.di%3];g++}
    T.age++;
    T.loy=clamp(T.loy+(TWI[t].c(F)?1:-2),0,100);
    if(d.c(F)){T.loy=clamp(T.loy+10,0,100);rep.lines.push({ok:true,t:TW[t].n+': просьба выполнена («'+d.t+'»), лояльность +10'});T.di++;T.age=0}
    else if(T.age>=3){T.loy=clamp(T.loy-7,0,100);rep.lines.push({ok:false,t:TW[t].n+' теряет терпение: «'+d.t+'» не выполнено, лояльность −7'});T.di++;T.age=0}
  });
  if(S.noise>60){S.trust=clamp(S.trust-5,0,100);S.regions.forEach(r=>setR(r,'mood',-3));rep.lines.push({ok:false,t:'Шум в СМИ слишком велик: доверие Администрации −5, настроение избирателей −3'})}
  S.noise=Math.round(S.chron+Math.max(0,S.noise-S.chron)*.78);
  if(UI.hard){
    S.natEr-=.7;TORD.forEach(t=>{S.towers[t].loy=clamp(S.towers[t].loy-1.5,0,100)});S.noise=clamp(S.noise+3,0,100);
    rep.lines.push({ok:false,t:'День выборов: рейтинг ЕР −0,7 п.п., лояльность всех башен −1,5, шум +3'});
    if(S.erW!=null){const g=forecast(0).nat.er-S.erW;if(g<=0){S.trust=clamp(S.trust-4,0,100);rep.lines.push({ok:false,t:'ЕР не набрала рейтинг за неделю: доверие Администрации −4'})}}
  }
  if(UI.noun){
    S.nuB=S.nuB||{};const FF=forecast(0);const pl=[];
    PARTIES.forEach(p=>{const g=1+(FF.nat[p]>=5?1:0);if(p==='er')S.natEr+=g;else S.nuB[p]=(S.nuB[p]||0)+g;pl.push(PN[p]+' +'+g)});
    S.trust=clamp(S.trust-2,0,100);
    rep.lines.push({ok:false,t:'Никакого Единства: рейтинги партий растут ('+pl.join(', ')+'), доверие Администрации −2'});
    const g2=forecast(0).nat.er-(S.erW==null?1e9:S.erW);
    if(g2>0){const d=Math.min(6,Math.max(1.5,2*g2));TORD.forEach(t=>{S.towers[t].loy=clamp(S.towers[t].loy-d,0,100)});rep.lines.push({ok:false,t:'Рейтинг ЕР вырос: лояльность всех башен −'+fmt(d,1)})}
    for(const p in S.nuB)S.nuB[p]*=.9;
  }
  S.regions.forEach(r=>{
    r.mood=clamp(r.mood+(MOOD0[r.type]-r.mood)*.05-Math.max(0,S.noise-40)*.05,0,100);
    r.camp*=.94;r.mob*=.92;
  });
  S.natTurn*=.9;S.natEr*=.9;
  chk();
  const over=checkOver();
  rep.n=S.week;
  S.rep=rep;
  if(over){S.fin={over};S.phase='final';recordRun();save();render();return}
  S.phase='wsum';save();render();
}
function nextWeek(){
  S.week++;
  if(S.week>WEEKS){S.day=1;S.ev={kind:'day',id:'d1'};S.phase='event';say('Начались три дня голосования.')}
  else startWeek();
  chk();
  save();render();
}
function checkOver(){
  if(S.trust<=0)return 'trust';
  if(eliteAvg()<=25)return 'elite';
  if(moodAvg()<=25)return 'mood';
  return null;
}

/* ---- final evaluation ---- */
function finishElection(){
  const F=forecast(1);
  const ev=evalAll(F);
  S.fin={reg:F.regs.map(o=>({id:o.r.id,t:o.t,er:o.sh.er,nm:o.r.name})),nat:F.nat,turn:F.turn,seats:F.seats,list:F.list,smd:F.smd,pass:F.pass,ev};
  S.phase='final';recordRun();
}
function evalAll(F){
  const erS=F.seats.er;
  const apParts=[
    {t:'ЕР не меньше 330 мандатов',ok:erS>=330,v:erS+' мандатов'},
    {t:'Явка не ниже 56%',ok:F.turn>=56,v:fmt(F.turn,1)+'%'},
    {t:'Шум в СМИ не выше 40',ok:S.noise<=40,v:S.noise+''},
    {t:'Все четыре оппозиционные партии в Думе',ok:['kp','ld','nl','sr'].every(p=>F.nat[p]>=5),v:['kp','ld','nl','sr'].filter(p=>F.nat[p]<5).map(p=>PN[p]).join(', ')||'проходят все'}
  ];
  const apOk=S.trust>=40&&apParts.filter(x=>x.ok).length>=3;
  const tw=TORD.map(t=>{
    const i=TWI[t],ok=i.c(F);const loy=clamp(S.towers[t].loy+(ok?10:-10),0,100);
    return {id:t,t:i.t,ok,loy,sat:loy>=55};
  });
  const wl=avgW(tw,x=>TW[x.id].w,x=>x.loy);
  const elOk=wl>=55&&tw.filter(x=>x.sat).length>=4&&tw.every(x=>x.loy>=30);
  const mood=moodAvg();
  const prot=S.regions.filter(r=>protest(r)>70).map(r=>r.name);
  const voOk=mood>=60&&prot.length<=2;
  const n=(apOk?1:0)+(elOk?1:0)+(voOk?1:0);
  return {apParts,apOk,tw,wl,elOk,mood,prot,voOk,n};
}

/* проекции и контуры */
function conic(lon0,p1,p2,p0){const d=Math.PI/180,l1=p1*d,l2=p2*d,L0=lon0*d;
  const n=Math.log(Math.cos(l1)/Math.cos(l2))/Math.log(Math.tan(Math.PI/4+l2/2)/Math.tan(Math.PI/4+l1/2));
  const F=Math.cos(l1)*Math.pow(Math.tan(Math.PI/4+l1/2),n)/n;
  const rho=p=>F/Math.pow(Math.tan(Math.PI/4+p*d/2),n),r0=rho(p0);
  return ([lo,la])=>{const t=n*(lo*d-L0),r=rho(la);return [1000*r*Math.sin(t),-1000*(r0-r*Math.cos(t))]}}
function chaikin(pts){const o=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];o.push([.75*a[0]+.25*b[0],.75*a[1]+.25*b[1]],[.25*a[0]+.75*b[0],.25*a[1]+.75*b[1]])}return o}
const pathOf=polys=>polys.map(p=>'M'+p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join('L')+'Z').join('');
const MAPG=(()=>{const out={};
  DISTS.forEach(D=>{const P=conic(...D.proj),polys=MAPGEO[D.id].map(poly=>chaikin(poly.map(P)));
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;polys.forEach(p=>p.forEach(q=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])}));
    out[D.id]={P,d:pathOf(polys),bb:[x0,y0,x1,y1]}});
  const PN0=conic(100,52,64,40);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  DISTS.forEach(D=>{const polys=MAPGEO[D.id].map(poly=>chaikin(poly.map(PN0)));polys.forEach(p=>p.forEach(q=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])}));out[D.id].loc=pathOf(polys)});

function mapBox(){const w=RES.lw||1200;let sw;
  if(w>1180)sw=Math.min(w,1380)-24-292-352-24-30;else if(w>820)sw=w-24-340-12-30;else sw=w-24-30;
  return {sw:Math.max(300,Math.min(sw,760)),asp:w<=560?1:1.5}}
function distView(D){const g=MAPG[D.id],{sw,asp}=mapBox(),bw=g.bb[2]-g.bb[0],bh=g.bb[3]-g.bb[1];
  let W=bw*1.16,H=W/asp;if(H<bh*1.16){H=bh*1.16;W=H*asp}
  const cx=(g.bb[0]+g.bb[2])/2,cy=(g.bb[1]+g.bb[3])/2+H*.015;

const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function scol(sc,t){const s=SCALES[sc];t=clamp(t,0,1);const x=t*(s.length-1),i=Math.min(s.length-2,Math.floor(x)),f=x-i,a=hx(s[i]),b=hx(s[i+1]);return 'rgb('+a.map((v,j)=>Math.round(v+(b[j]-v)*f)).join(',')+')'}

  const M=MMODES.find(x=>x.k===m),o=F.byId[r.id];
  const v=m==='ar'?r.ar:m==='mood'?r.mood:m==='turn'?o.t:m==='er'?o.sh.er:protest(r);
  return {fill:scol(M.sc,(v-M.lo)/(M.hi-M.lo)),val:String(Math.round(v)),num:Math.round(v)}}

  const go=()=>{const F=forecast(0),D=distById(id);st.classList.remove('leave','enter');st.innerHTML=stageHTML(D,F,UI.mmode||'tower');
    const inf=$('#mapinfo');if(inf){inf.innerHTML=infoHTML(D,F);inf.animate&&!reduceMotion()&&inf.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:350,easing:'ease-out'})}
    void st.offsetWidth;st.classList.add('enter')};
  if(reduceMotion()){go();return}
  st.classList.remove('enter');st.classList.add('leave');
  mapSwitchDist._t=setTimeout(go,190);

  const F=forecast(0),lg=$('#maplegend');

  document.querySelectorAll('#mapstage .mk').forEach((g,i)=>{
    const r=R(g.dataset.id),c=mcol(m,r,F),dot=g.querySelector('.mkdot'),tx=g.querySelector('.mkv'),b=g.querySelector('.mkb');
    dot.style.fill=c.fill;
    const from=parseFloat(tx.dataset.v);tx.dataset.v=c.num==null?'':c.num;

const RESOPT=[['auto','Авто (до 1920×1080)','Подстраивается под окно. На экранах больше 1920×1080 интерфейс увеличивается, а не растягивается'],['1920x1080','1920×1080 (Full HD)','Интерфейс рассчитан на Full HD и масштабируется под окно браузера'],['1600x900','1600×900','Чуть крупнее, подходит для ноутбуков и окон меньше Full HD'],['1366x768','1366×768','Крупный интерфейс для небольших экранов'],['1280x720','1280×720 (HD)','Самый крупный интерфейс']];
let RES={s:1,lw:window.innerWidth||1280,lh:window.innerHeight||720};
function resCalc(){
  const iw=window.innerWidth||1280,ih=window.innerHeight||720,r=UI.res||'auto';let s=1;
  if(r==='auto'){s=Math.max(1,Math.min(iw/1920,ih/1080))}
  else{const m=r.split('x'),W=+m[0],H=+m[1];if(W>0&&H>0)s=Math.min(iw/W,ih/H)}
  if(!(s>0)||!isFinite(s))s=1;
  s=Math.min(4,Math.max(.4,s));
  return {s,lw:iw/s,lh:ih/s};
}
function applyRes(){
  RES=resCalc();const el=document.documentElement,b=document.body;
  if(Math.abs(RES.s-1)<.005){el.style.zoom='';RES.s=1;RES.lw=window.innerWidth||1280;RES.lh=window.innerHeight||720}else el.style.zoom=String(RES.s);
  el.style.setProperty('--vw1',(RES.lw/100)+'px');el.style.setProperty('--vh1',(RES.lh/100)+'px');
  if(b){b.classList.toggle('lw-sm',RES.lw<=1560);b.classList.toggle('lh-sm',RES.lh<=900);b.classList.toggle('lh-xs',RES.lh<=820)}
}

function hemiSVG(seats){
  const rows=10,r0=58,dr=9.6,radii=[];for(let i=0;i<rows;i++)radii.push(r0+i*dr);
  const tot=radii.reduce((a,b)=>a+b,0);const ns=radii.map(r=>Math.round(450*r/tot));
  ns[rows-1]+=450-ns.reduce((a,b)=>a+b,0);
  const pts=[];radii.forEach((r,i)=>{for(let k=0;k<ns[i];k++){const a=Math.PI*(1-(k+.5)/ns[i]);pts.push({x:160+r*Math.cos(a),y:162-r*Math.sin(a),a,r})}});
  pts.sort((p,q)=>q.a-p.a||p.r-q.r);
  const seq=[];HEMI.forEach(p=>{for(let k=0;k<(seats[p]||0);k++)seq.push(p)});
  const dots=pts.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.1" fill="${PC[seq[i]||'ot']}" opacity="${seq[i]?1:.25}"/>`).join('');
  return `<svg class="hemi" viewBox="0 0 320 168" role="img" aria-label="Распределение 450 мандатов">${dots}</svg>`;
}

const FA={run:false,t0:0,raf:0,lastDraw:0,model:null};
const FA_DEG=5200,FA_PAUSE=900,FA_ST=11000,FA_END=FA_DEG+FA_PAUSE+FA_ST;
const FA_M={
  deg:{er:1.38,kp:.55,ld:.7,nl:.85,sr:.75,gr:.6,ot:.8},
  st:{er:.74,kp:1.42,ld:1.18,nl:1.3,sr:1.12,gr:1.25,ot:1.1},
  mid:{er:1.08,kp:.9,ld:.95,nl:.85,sr:.97,gr:.9,ot:.95}
};
const faSm=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
function faModel(){
  const f=S.fin;
  const P=PARTIES.filter(p=>f.nat[p]>0.4&&(p!=='gr'||S.gru==='allowed')).sort((a,b)=>f.nat[b]-f.nat[a]);
  let vs=0,ds=0;S.regions.forEach(r=>{vs+=r.voters;ds+=r.voters*Math.min(r.des||0,3)/3});
  const dF=clamp(.08+.22*(ds/(vs||1)),.08,.3);
  return {P,dF};
}
function faMult(p,i,t){
  const ph=i*1.7+.6;
  if(t<FA_DEG){
    const a=t/FA_DEG;
    return FA_M.deg[p]*(1+(.22*(1-a)+.04)*Math.sin(a*17+ph));
  }
  if(t<FA_DEG+FA_PAUSE)return FA_M.deg[p]*(1+.04*Math.sin(17+ph));
  const u=clamp((t-FA_DEG-FA_PAUSE)/FA_ST,0,1);
  const k=[[0,FA_M.deg[p]*(1+.04*Math.sin(17+ph))],[.28,FA_M.st[p]],[.62,FA_M.mid[p]],[1,1]];
  let m=1;
  for(let j=0;j<k.length-1;j++)if(u>=k[j][0]&&u<=k[j+1][0]){m=k[j][1]+(k[j+1][1]-k[j][1])*faSm((u-k[j][0])/(k[j+1][0]-k[j][0]));break}
  return m*(1+.07*Math.sin(u*23+ph)*(1-u));
}
function faState(t){
  const f=S.fin,{P,dF}=FA.model;
  if(t>=FA_END)return {c:1,sh:f.nat,seats:f.seats,turn:f.turn,stage:3};
  let c,stage;
  if(t<FA_DEG){stage=1;c=dF*faSm(t/FA_DEG)}
  else if(t<FA_DEG+FA_PAUSE){stage=1.5;c=dF}
  else{stage=2;c=dF+(1-dF)*faSm((t-FA_DEG-FA_PAUSE)/FA_ST)}
  const raw={};let sum=0;
  PARTIES.forEach((p,i)=>{raw[p]=Math.max(0,f.nat[p])*faMult(p,i,t);sum+=raw[p]});
  const sh={};PARTIES.forEach(p=>sh[p]=raw[p]/(sum||1)*100);
  const wt=PARTIES.map(p=>{const r=f.nat[p]>0?sh[p]/f.nat[p]:0;return ((f.smd[p]||0)+(sh[p]>=5?(f.list[p]||0):0))*r});
  const al=alloc(Math.round(450*c),wt);
  const seats={};PARTIES.forEach((p,i)=>seats[p]=al[i]);
  const turn=f.turn*(.78+.22*c)+.8*Math.sin(c*20)*(1-c);
  return {c,sh,seats,turn,stage};
}

function chk(){
  if(!S)return [];
  if(S.mode&&S.mode.wild!==undefined?S.mode.wild:UI.wild)return [];
  const A=achLoad(),got=[];
  const isEnd=!!(S.fin&&!S.fin.over),isOver=!!(S.fin&&S.fin.over);
  ACH.forEach(a=>{
    if(A[a.id])return;
    if(a.k==='f'&&!isEnd)return;
    if(a.k==='o'&&!isOver)return;
    let ok=false;try{ok=!!a.c()}catch(e){}
    if(ok){A[a.id]=Date.now();got.push(a)}
  });
  if(got.length){
    lsSet(ACHK,A);
    S.stAch=(S.stAch||[]).concat(got.map(a=>a.id));
    TOAST=(TOAST?TOAST+' · ':'')+'Достижение: '+got.map(a=>a.n).join(', ');
  }
  return got;
}

function rnd(){S.rs=(S.rs+0x6D2B79F5)|0;let t=Math.imul(S.rs^(S.rs>>>15),1|S.rs);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}
function alloc(n,w){const sum=w.reduce((a,b)=>a+b,0)||1;const q=w.map(x=>x/sum*n);const a=q.map(Math.floor);const rem=n-a.reduce((x,y)=>x+y,0);const o=q.map((x,i)=>[x-a[i],i]).sort((p,q2)=>q2[0]-p[0]);for(let k=0;k<rem;k++)a[o[k][1]]++;return a}

    pb:{er:0,kp:0,ld:0,nl:0,sr:0,gr:0,ot:0},natEr:0,natTurn:0,rules:{three:false,des:false,early:false,smd:false},picked:[],

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---- effects ---- */
const RK={ar:'HQ',mood:'mood',camp:'campaigning',mob:'mobilization',des:'REV',prog:'programs'};
function setR(r,k,v){
  if(k==='des')r.des=clamp(r.des+v,0,desCap());
  else if(k==='prog')r.prog+=v;
  else r[k]=clamp(r[k]+v,0,100);
}
function applyFx(f0){
  const f=JSON.parse(JSON.stringify(f0));const notes=[];
  if(S.sanc>0&&((f.noise||0)>0||(f.loy&&Object.values(f.loy).some(v=>v<0)))){
    S.sanc--;if(f.noise>0)f.noise=0;
    if(f.loy)for(const k in f.loy)if(f.loy[k]<0)f.loy[k]=Math.ceil(f.loy[k]/2);
    notes.push('the Curator’s sanction removed part of the fallout');
  }
  if(f.trust)S.trust=clamp(S.trust+f.trust,0,100);
  if(f.budget)S.budget+=f.budget;
  if(f.lev)S.lev=clamp(S.lev+f.lev,0,15);
  if(f.noise)S.noise=clamp(S.noise+f.noise,0,100);
  if(f.chron){S.chron=Math.max(0,S.chron+f.chron);S.noise=clamp(S.noise+(f.chron>0?f.chron:0),0,100)}
  if(f.loy)for(const k in f.loy)S.towers[k].loy=clamp(S.towers[k].loy+f.loy[k],0,100);
  if(f.mood)S.regions.forEach(r=>setR(r,'mood',f.mood));
  if(f.turn)S.natTurn+=f.turn;
  if(f.er)S.natEr+=f.er;
  if(f.party)for(const p in f.party)S.pb[p]=clamp(S.pb[p]+f.party[p],-4,4);
  if(f.reg)for(const id in f.reg)for(const k in f.reg[id])setR(R(id),k,f.reg[id][k]);
  if(f.regT)for(const ty in f.regT)S.regions.filter(r=>r.type===ty).forEach(r=>{for(const k in f.regT[ty])setR(r,k,f.regT[ty][k])});
  if(f.regAll)S.regions.forEach(r=>{for(const k in f.regAll)setR(r,k,f.regAll[k])});
  if(f.regX)for(const id in f.regX){const r=R(id),x=f.regX[id];if(x.turn)r.tb=(r.tb||0)+x.turn;if(x.party){r.pb=r.pb||{};for(const p in x.party)r.pb[p]=(r.pb[p]||0)+x.party[p]}}
  if(f.gru)S.gru=f.gru==='allowed'?'allowed':f.gru;
  if(f.flag)S.flags[f.flag]=true;
  return {f,notes};
}
function fxText(f){
  const a=[];
  if(f.trust)a.push('Administration trust '+sgn(f.trust));
  if(f.budget)a.push('Budget '+sgn(f.budget));
  if(f.lev)a.push('Leverage '+sgn(f.lev));
  if(f.noise)a.push('Noise '+sgn(f.noise));
  if(f.loy)for(const k in f.loy)a.push(TW[k].s+' '+sgn(f.loy[k]));
  if(f.mood)a.push('Mood everywhere '+sgn(f.mood));
  if(f.turn)a.push('Turnout '+sgn(f.turn,1)+' pp');
  if(f.er)a.push('UR '+sgn(f.er,1)+' pp');
  if(f.party)for(const p in f.party)a.push(PN[p]+' '+sgn(f.party[p],1));
  if(f.reg)for(const id in f.reg){const n=REG0.find(r=>r.id===id).name;for(const k in f.reg[id])a.push(n+': '+RK[k]+' '+sgn(f.reg[id][k]))}
  if(f.regT)for(const ty in f.regT)for(const k in f.regT[ty])a.push('Type “'+TYPES[ty]+'”: '+RK[k]+' '+sgn(f.regT[ty][k]));
  if(f.regX)for(const id in f.regX){const n=REG0.find(r=>r.id===id).name,x=f.regX[id];if(x.turn)a.push(n+': turnout '+sgn(x.turn,1)+' pp');if(x.party)for(const p in x.party)a.push(n+': '+PN[p]+' '+sgn(x.party[p],1))}
  if(f.regAll)for(const k in f.regAll)a.push('All regions: '+RK[k]+' '+sgn(f.regAll[k]));
  if(f.gru==='allowed')a.push('Yabloko on the ballot');
  if(f.gru==='refused')a.push('Yabloko barred');
  if(f.gru==='struck')a.push('Yabloko struck off');
  return a.join('; ');
}

/* ---- election maths ---- */
function turnoutOf(r){
  return clamp(r.bt+S.natTurn+.06*(r.ar-45)+.035*r.camp+.08*r.mob+2.2*r.des+(r.early?2.5:0)+(S.rules.three?3:0)+.05*(r.mood-55)-2+(r.tb||0),22,97);
}
function sharesOf(r,sigma){
  const s={};['er','kp','ld','nl','sr','ot'].forEach(p=>s[p]=r.base[p]+S.pb[p]+((r.pb&&r.pb[p])||0)+((S.nuB&&S.nuB[p])||0));
  const sh=clamp((55-r.mood)*.06,-2,4);
  s.er+=.085*(r.ar-45)+.045*r.camp+.9*r.des+.035*r.mob+S.natEr-(r.obs?1:0)-sh-3;
  s.kp+=sh*.35-(r.id==='alt'?1.6:.8)*r.des;s.nl+=sh*.35;s.ld+=sh*.3;
  s.gr=0;
  if(S.gru==='allowed'){
    const g=Math.max(.5,1.6+.16*r.base.nl+S.pb.gr+((r.pb&&r.pb.gr)||0)+((S.nuB&&S.nuB.gr)||0));s.gr=g;
    s.nl-=g*.5;s.ot-=g*.2;s.kp-=g*.15;s.er-=g*.15;
  }
  if(sigma)for(const p in s)s[p]+=(rnd()-.5)*2*sigma*(p==='er'?1.4:.7);
  let tot=0;for(const p in s){s[p]=Math.max(.3,s[p]);tot+=s[p]}
  for(const p in s)s[p]=s[p]/tot*100;
  return s;
}
function forecast(sigma){
  const regs=S.regions.map(r=>({r,t:clamp(turnoutOf(r)+(sigma?(rnd()-.5)*2*sigma*1.5:0),20,98),sh:sharesOf(r,sigma)}));
  const votes={};PARTIES.forEach(p=>votes[p]=0);let tot=0,vt=0;
  regs.forEach(o=>{const v=o.r.voters*o.t/100;tot+=v;vt+=o.r.voters;PARTIES.forEach(p=>votes[p]+=v*o.sh[p]/100)});
  const nat={};PARTIES.forEach(p=>nat[p]=votes[p]/tot*100);
  const turn=tot/vt*100;
  const pass=PARTIES.filter(p=>nat[p]>=5);
  const la=alloc(225,pass.map(p=>nat[p]));
  const list={};PARTIES.forEach(p=>list[p]=0);pass.forEach((p,i)=>list[p]=la[i]);
  const smd={};PARTIES.forEach(p=>smd[p]=0);
  const byId={};
  regs.forEach(o=>{
    byId[o.r.id]=o;
    const w=PARTIES.map(p=>Math.pow(o.sh[p],2.4)*(p==='er'?(1+.006*(o.r.ar-45)+(S.rules.smd?.12:0)):1));
    const a=alloc(o.r.smd,w);PARTIES.forEach((p,i)=>smd[p]+=a[i]);
  });
  const seats={};PARTIES.forEach(p=>seats[p]=list[p]+smd[p]);
  return {regs,byId,nat,turn,pass,list,smd,seats};
}

/* ---- action model ---- */
function why(a){
  if(a.na)return a.na;
  if(a.k&&S.mode&&S.mode.dh&&S.dhu&&S.dhu[a.k])return 'one-time only: already used';
  if(a.free)return '';
  if(UI.wild)return a.na||'';
  if(S.ap<(a.ap||0))return 'no actions left';
  if(S.budget<cB(a))return 'not enough budget';
  if(S.lev<cL(a))return 'not enough leverage';
  return '';
}
function perform(a){
  if(S.phase!=='play'||why(a))return;
  if(!a.free&&!UI.wild){S.ap-=a.ap||0;S.budget-=cB(a);S.lev-=cL(a)}
  if(a.k&&!a.free&&S.mode&&S.mode.dh)(S.dhu||(S.dhu={}))[a.k]=1;
  if(!a.free){const st=ST();st.act++;st.byT[a.t]=(st.byT[a.t]||0)+1}
  a.run();
  chk();
  if(UI.hard&&a.elite){const sfx=' Public discontent grows: mood −1.5.';applyFx({mood:-1.5});if(S.log[0])S.log[0].t+=sfx;TOAST=(TOAST||'')+sfx}
  save();render();
}
function chips(a){
  const c=[];
  if(a.free)return a.d||'';
  if(a.ap)c.push(a.ap+' act.');
  if(a.b)c.push(cB(a)+' bn');
  if(a.l)c.push(cL(a)+' lev.');
  return (a.d?a.d+(c.length?' · ':''):'')+c.join(', ');
}
function btn(a,cls){
  const w=why(a);
  const i=REGF.push(()=>perform(a))-1;
  return `<button class="ab ${cls||''}" data-r="${i}" ${w?'disabled':''} title="${esc(w||a.h||'')}">${esc(a.t)}<span class="c">${esc(w?w:chips(a))}</span></button>`;
}

/* ---- week flow ---- */
function pickEvent(){
  const sid=SCHEDULE[S.week];
  if(sid)return {kind:'week',id:sid};
  let id;
  while(S.deck.length){id=S.deck.shift();if(!EV[id].a||EV[id].a())return {kind:'week',id};}
  return {kind:'week',id:'r_pol'};
}
function startWeek(){
  S.dlLeft=60000;
  S.ap=apCap();S.erW=forecast(0).nat.er;S.budget+=10;S.lev=Math.min(15,S.lev+2);S.dirI=S.week-1;
  TORD.forEach(t=>S.towers[t].mw=0);
  S.ev=pickEvent();S.phase='event';
  say(`Week ${S.week}. Budget income: +10 bn, leverage +2.`);
}
function chooseOpt(i){
  const ev=EV[S.ev.id],o=ev.o[i];
  const r=applyFx(o.fx||{});
  const txt=fxText(r.f);
  S.evRes={t:o.t,fx:txt,notes:r.notes};
  say(ev.t+': “'+o.t+'”'+(txt?' ('+txt+')':''));
  ST().evN=(ST().evN||0)+1;chk();
  S.phase='evres';save();render();
}
function afterRes(){
  if(S.ev.kind==='day'){
    if(S.day<3){S.day++;S.ev={kind:'day',id:'d'+S.day};S.phase='event'}
    else finishElection();
  }else S.phase='play';
  save();render();
}

function endWeek(){
  const F=forecast(0),rep={lines:[]};
  const D=DIRS[S.dirI],ok=D.c(F);
  S.trust=clamp(S.trust+(ok?6:-7),0,100);
  if(ok)ST().dirOk=(ST().dirOk||0)+1;
  rep.lines.push({ok,t:'Curator’s directive: “'+D.t+'” — '+(ok?'met (trust +6)':'not met (trust −7)')});
  TORD.forEach(t=>{
    const T=S.towers[t];let d=TWD[t][T.di%3],g=0;
    while(d.a&&!d.a()&&g<3){T.di++;d=TWD[t][T.di%3];g++}
    T.age++;
    T.loy=clamp(T.loy+(TWI[t].c(F)?1:-2),0,100);
    if(d.c(F)){T.loy=clamp(T.loy+10,0,100);rep.lines.push({ok:true,t:TW[t].n+': request fulfilled (“'+d.t+'”), loyalty +10'});T.di++;T.age=0}
    else if(T.age>=3){T.loy=clamp(T.loy-7,0,100);rep.lines.push({ok:false,t:TW[t].n+' is losing patience: “'+d.t+'” not fulfilled, loyalty −7'});T.di++;T.age=0}
  });
  if(S.noise>60){S.trust=clamp(S.trust-5,0,100);S.regions.forEach(r=>setR(r,'mood',-3));rep.lines.push({ok:false,t:'Media noise is too high: Administration trust −5, voter mood −3'})}
  S.noise=Math.round(S.chron+Math.max(0,S.noise-S.chron)*.78);
  if(UI.hard){
    S.natEr-=.7;TORD.forEach(t=>{S.towers[t].loy=clamp(S.towers[t].loy-1.5,0,100)});S.noise=clamp(S.noise+3,0,100);
    rep.lines.push({ok:false,t:'Election Day: UR rating −0.7 pp, all towers’ loyalty −1.5, noise +3'});
    if(S.erW!=null){const g=forecast(0).nat.er-S.erW;if(g<=0){S.trust=clamp(S.trust-4,0,100);rep.lines.push({ok:false,t:'UR gained no rating this week: Administration trust −4'})}}
  }
  if(UI.noun){
    S.nuB=S.nuB||{};const FF=forecast(0);const pl=[];
    PARTIES.forEach(p=>{const g=1+(FF.nat[p]>=5?1:0);if(p==='er')S.natEr+=g;else S.nuB[p]=(S.nuB[p]||0)+g;pl.push(PN[p]+' +'+g)});
    S.trust=clamp(S.trust-2,0,100);
    rep.lines.push({ok:false,t:'No Unity: party ratings rise ('+pl.join(', ')+'), Administration trust −2'});
    const g2=forecast(0).nat.er-(S.erW==null?1e9:S.erW);
    if(g2>0){const d=Math.min(6,Math.max(1.5,2*g2));TORD.forEach(t=>{S.towers[t].loy=clamp(S.towers[t].loy-d,0,100)});rep.lines.push({ok:false,t:'UR’s rating rose: all towers’ loyalty −'+fmt(d,1)})}

  }
  S.regions.forEach(r=>{
    r.mood=clamp(r.mood+(MOOD0[r.type]-r.mood)*.05-Math.max(0,S.noise-40)*.05,0,100);
    r.camp*=.94;r.mob*=.92;
  });

  chk();
  const over=checkOver();

  S.phase='wsum';save();render();
}

  if(S.trust<=0)return 'trust';

/* ---- final evaluation ---- */
function finishElection(){
  const F=forecast(1);
  const ev=evalAll(F);
  S.fin={reg:F.regs.map(o=>({id:o.r.id,t:o.t,er:o.sh.er,nm:o.r.name})),nat:F.nat,turn:F.turn,seats:F.seats,list:F.list,smd:F.smd,pass:F.pass,ev};
  S.phase='final';recordRun();
}
function evalAll(F){
  const erS=F.seats.er;
  const apParts=[
    {t:'UR at least 330 seats',ok:erS>=330,v:erS+' seats'},
    {t:'Turnout at least 56%',ok:F.turn>=56,v:fmt(F.turn,1)+'%'},
    {t:'Media noise at most 40',ok:S.noise<=40,v:S.noise+''},
    {t:'All four opposition parties in the Duma',ok:['kp','ld','nl','sr'].every(p=>F.nat[p]>=5),v:['kp','ld','nl','sr'].filter(p=>F.nat[p]<5).map(p=>PN[p]).join(', ')||'all pass'}
  ];
  const apOk=S.trust>=40&&apParts.filter(x=>x.ok).length>=3;
  const tw=TORD.map(t=>{
    const i=TWI[t],ok=i.c(F);const loy=clamp(S.towers[t].loy+(ok?10:-10),0,100);
    return {id:t,t:i.t,ok,loy,sat:loy>=55};
  });
  const wl=avgW(tw,x=>TW[x.id].w,x=>x.loy);
  const elOk=wl>=55&&tw.filter(x=>x.sat).length>=4&&tw.every(x=>x.loy>=30);
  const mood=moodAvg();
  const prot=S.regions.filter(r=>protest(r)>70).map(r=>r.name);
  const voOk=mood>=60&&prot.length<=2;
  const n=(apOk?1:0)+(elOk?1:0)+(voOk?1:0);
  return {apParts,apOk,tw,wl,elOk,mood,prot,voOk,n};
}

  const cls=inv?(v>60?'lo':v>35?'mid':'hi'):(v<35?'lo':v<55?'mid':'hi');
  return `<div class="meter"><div class="l"><span>${label}</span><b class="num">${v}</b></div><div class="bar ${cls}" title="${esc(hint)}"><i style="width:${v}%"></i>${thr?`<b style="left:${thr}%"></b>`:''}</div></div>`;
}

function mapSwitchDist(id){
  if(UI.dist===id)return;UI.dist=id;
  const st=$('#mapstage');if(!st){render();return}
  document.querySelectorAll('.dtab').forEach(b=>b.setAttribute('aria-selected',b.dataset.d===id));

  const tp=$('#maptip');if(tp)tp.classList.remove('on');
  clearTimeout(mapSwitchDist._t);
  const go=()=>{const F=forecast(0),D=distById(id);st.classList.remove('leave','enter');st.innerHTML=stageHTML(D,F,UI.mmode||'tower');
    const inf=$('#mapinfo');if(inf){inf.innerHTML=infoHTML(D,F);inf.animate&&!reduceMotion()&&inf.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:350,easing:'ease-out'})}
    void st.offsetWidth;st.classList.add('enter')};
  if(reduceMotion()){go();return}

}

const RESOPT=[['auto','Auto (up to 1920×1080)','Adapts to the window. On screens larger than 1920×1080 the interface is scaled up, not stretched'],['1920x1080','1920×1080 (Full HD)','The interface is designed for Full HD and scaled to your browser window'],['1600x900','1600×900','A bit larger; good for laptops and windows smaller than Full HD'],['1366x768','1366×768','A large interface for smaller screens'],['1280x720','1280×720 (HD)','The largest interface']];
let RES={s:1,lw:window.innerWidth||1280,lh:window.innerHeight||720};
function resCalc(){
  const iw=window.innerWidth||1280,ih=window.innerHeight||720,r=UI.res||'auto';let s=1;
  if(r==='auto'){s=Math.max(1,Math.min(iw/1920,ih/1080))}
  else{const m=r.split('x'),W=+m[0],H=+m[1];if(W>0&&H>0)s=Math.min(iw/W,ih/H)}
  if(!(s>0)||!isFinite(s))s=1;
  s=Math.min(4,Math.max(.4,s));
  return {s,lw:iw/s,lh:ih/s};
}
function applyRes(){
  RES=resCalc();const el=document.documentElement,b=document.body;
  if(Math.abs(RES.s-1)<.005){el.style.zoom='';RES.s=1;RES.lw=window.innerWidth||1280;RES.lh=window.innerHeight||720}else el.style.zoom=String(RES.s);
  el.style.setProperty('--vw1',(RES.lw/100)+'px');el.style.setProperty('--vh1',(RES.lh/100)+'px');
  if(b){b.classList.toggle('lw-sm',RES.lw<=1560);b.classList.toggle('lh-sm',RES.lh<=900);b.classList.toggle('lh-xs',RES.lh<=820)}
}

function hemiSVG(seats){
  const rows=10,r0=58,dr=9.6,radii=[];for(let i=0;i<rows;i++)radii.push(r0+i*dr);
  const tot=radii.reduce((a,b)=>a+b,0);const ns=radii.map(r=>Math.round(450*r/tot));
  ns[rows-1]+=450-ns.reduce((a,b)=>a+b,0);
  const pts=[];radii.forEach((r,i)=>{for(let k=0;k<ns[i];k++){const a=Math.PI*(1-(k+.5)/ns[i]);pts.push({x:160+r*Math.cos(a),y:162-r*Math.sin(a),a,r})}});
  pts.sort((p,q)=>q.a-p.a||p.r-q.r);
  const seq=[];HEMI.forEach(p=>{for(let k=0;k<(seats[p]||0);k++)seq.push(p)});
  const dots=pts.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.1" fill="${PC[seq[i]||'ot']}" opacity="${seq[i]?1:.25}"/>`).join('');
  return `<svg class="hemi" viewBox="0 0 320 168" role="img" aria-label="Distribution of the 450 seats">${dots}</svg>`;
}

function helpHTML(){
  return `<div class="ov"><div class="card"><button class="cl" aria-label="Close" data-r="${REGF.push(()=>{UI.help=false;render()})-1}">×</button><h2>How to play</h2>

  <ul class="cl2"><li><b>The Administration.</b> Wants 330 seats for UR, 56% turnout, media noise no higher than 40 and all four opposition parties in the Duma. Three out of four is enough. Hands you a directive every week.</li>
  <li><b>The elites.</b> Six towers. Each has a request and an end goal, for example LDPR ≥ 7% or CPRF ≥ 11%. If you squeeze the opposition too hard, the towers take offense.</li>
  <li><b>The voters.</b> Their mood depends on programs, campaigning and media “noise.” Heavy-handed methods raise the noise and sour the mood.</li></ul>
  <p>Each week you have 4 actions (the campaign staff can be expanded to 5 in the national campaign), a budget and leverage. Every tower has a unique action with a 3-week cooldown, and every party has one unique action for the whole game. Actions are split between regions, elites, parties and the national campaign. Campaigning and mobilization fade over time, so rhythm matters.</p>
  <p>You win when all three sides are satisfied. You can also lose long before the end: if you are removed, the towers tear up their deals, or the streets rise in protest.</p>
  <blockquote style="margin:14px 0 4px;padding:8px 14px;border-left:4px solid var(--red);color:var(--ink-2)"><p style="margin:0">“Never do people lie so much as before an election, during a war, or after a hunt.”</p><p class="small" style="margin:4px 0 0">— Otto von Bismarck (attributed)</p></blockquote>
  <button class="opt" data-r="${REGF.push(()=>{UI.help=false;render()})-1}">Got it</button></div></div>`;

function rulesHTML(){
  const sel=S.picked;
  const items=Object.keys(RULES).map(k=>{
    const R2=RULES[k],on=sel.includes(k);
    const i=REGF.push(()=>{const a=S.picked;const x=a.indexOf(k);if(x>=0)a.splice(x,1);else if(a.length<2)a.push(k);render()})-1;
    return `<button class="opt" data-r="${i}" aria-pressed="${on}" style="${on?'background:var(--hl);border-width:3px':''}"><b>${on?'✓ ':''}${esc(R2.n)}</b><span class="eff">${esc(R2.d)}</span></button>`;
  }).join('');
  const go2=REGF.push(()=>{
    if(S.picked.length!==2)return;
    S.picked.forEach(k=>{S.rules[k]=true;applyFx(RULES[k].fx)});
    say('Rules adopted: '+S.picked.map(k=>RULES[k].n).join(', ')+'.');
    startWeek();save();render();
  })-1;
  return `<div class="ov"><div class="card"><h2>Rules of the game</h2><p>Your legislative capital is limited. Choose exactly two changes to the election rules. The rest stay as they are.</p>${items}
   <button class="opt" style="margin-top:14px;text-align:center;font-weight:600" data-r="${go2}" ${sel.length===2?'':'disabled'}>Adopt the rules (${sel.length} of 2)</button></div></div>`;
}

/* ---- election-night animation ---- */
const FA={run:false,t0:0,raf:0,lastDraw:0,model:null};
const FA_DEG=5200,FA_PAUSE=900,FA_ST=11000,FA_END=FA_DEG+FA_PAUSE+FA_ST;
const FA_M={
  deg:{er:1.38,kp:.55,ld:.7,nl:.85,sr:.75,gr:.6,ot:.8},
  st:{er:.74,kp:1.42,ld:1.18,nl:1.3,sr:1.12,gr:1.25,ot:1.1},
  mid:{er:1.08,kp:.9,ld:.95,nl:.85,sr:.97,gr:.9,ot:.95}
};
const faSm=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
function faModel(){
  const f=S.fin;
  const P=PARTIES.filter(p=>f.nat[p]>0.4&&(p!=='gr'||S.gru==='allowed')).sort((a,b)=>f.nat[b]-f.nat[a]);
  let vs=0,ds=0;S.regions.forEach(r=>{vs+=r.voters;ds+=r.voters*Math.min(r.des||0,3)/3});
  const dF=clamp(.08+.22*(ds/(vs||1)),.08,.3);
  return {P,dF};
}
function faMult(p,i,t){
  const ph=i*1.7+.6;
  if(t<FA_DEG){
    const a=t/FA_DEG;
    return FA_M.deg[p]*(1+(.22*(1-a)+.04)*Math.sin(a*17+ph));
  }
  if(t<FA_DEG+FA_PAUSE)return FA_M.deg[p]*(1+.04*Math.sin(17+ph));
  const u=clamp((t-FA_DEG-FA_PAUSE)/FA_ST,0,1);
  const k=[[0,FA_M.deg[p]*(1+.04*Math.sin(17+ph))],[.28,FA_M.st[p]],[.62,FA_M.mid[p]],[1,1]];
  let m=1;
  for(let j=0;j<k.length-1;j++)if(u>=k[j][0]&&u<=k[j+1][0]){m=k[j][1]+(k[j+1][1]-k[j][1])*faSm((u-k[j][0])/(k[j+1][0]-k[j][0]));break}
  return m*(1+.07*Math.sin(u*23+ph)*(1-u));
}
function faState(t){
  const f=S.fin,{P,dF}=FA.model;
  if(t>=FA_END)return {c:1,sh:f.nat,seats:f.seats,turn:f.turn,stage:3};
  let c,stage;
  if(t<FA_DEG){stage=1;c=dF*faSm(t/FA_DEG)}
  else if(t<FA_DEG+FA_PAUSE){stage=1.5;c=dF}
  else{stage=2;c=dF+(1-dF)*faSm((t-FA_DEG-FA_PAUSE)/FA_ST)}
  const raw={};let sum=0;
  PARTIES.forEach((p,i)=>{raw[p]=Math.max(0,f.nat[p])*faMult(p,i,t);sum+=raw[p]});
  const sh={};PARTIES.forEach(p=>sh[p]=raw[p]/(sum||1)*100);
  const wt=PARTIES.map(p=>{const r=f.nat[p]>0?sh[p]/f.nat[p]:0;return ((f.smd[p]||0)+(sh[p]>=5?(f.list[p]||0):0))*r});
  const al=alloc(Math.round(450*c),wt);
  const seats={};PARTIES.forEach((p,i)=>seats[p]=al[i]);
  const turn=f.turn*(.78+.22*c)+.8*Math.sin(c*20)*(1-c);
  return {c,sh,seats,turn,stage};
}
function finAnimHTML(){

function faDraw(t){

  g('fa-turn').textContent=fmt(st.turn,1);

  g('fa-pct').textContent=Math.floor(st.c*100+(st.c>=1?0:0))+'%';
  const lead=P.slice().sort((a,b)=>st.sh[b]-st.sh[a])[0];
  g('fa-lead').innerHTML=st.stage===3?'':`Leading: <b>${esc(PF[lead])}</b> — ${fmt(st.sh[lead],1)}%`;

function chk(){
  if(!S)return [];
  if(S.mode&&S.mode.wild!==undefined?S.mode.wild:UI.wild)return [];
  const A=achLoad(),got=[];
  const isEnd=!!(S.fin&&!S.fin.over),isOver=!!(S.fin&&S.fin.over);
  ACH.forEach(a=>{
    if(A[a.id])return;
    if(a.k==='f'&&!isEnd)return;
    if(a.k==='o'&&!isOver)return;
    let ok=false;try{ok=!!a.c()}catch(e){}
    if(ok){A[a.id]=Date.now();got.push(a)}
  });
  if(got.length){
    lsSet(ACHK,A);
    S.stAch=(S.stAch||[]).concat(got.map(a=>a.id));
    TOAST=(TOAST?TOAST+' · ':'')+'Achievement: '+got.map(a=>a.n).join(', ');
  }
  return got;
}

<script>
/* Ambient strings: soft synthesized cello + violin, plus the menu mute button */
(function(){
  var AC=window.AudioContext||window.webkitAudioContext;

  var muted=false;
  try{muted=localStorage.getItem('duma.mute')==='1'}catch(e){}
  var ctx=null,master=null,verb=null,started=false,timer=null,nextT=0,chordIdx=0,prog=0;
  var MASTER=0.85,vol=1;
  // perceptual volume curve: 0..100% slider -> cubic gain (about -60 dB at the bottom, silent at 0)
  function level(){return muted?0:MASTER*vol*vol*vol}

  var PROGS=[

    [[50,[62,65,69]],[53,[60,65,69]],[48,[60,64,67]],[45,[57,61,64]]]   // Dm F C A
  ];
  var SCALE=[62,64,65,67,69,70,72,74,76,77,79];

    var len=ctx.sampleRate*3.2,buf=ctx.createBuffer(2,len,ctx.sampleRate);

  }

    ctx=new AC();
    // mix bus -> compressor -> volume (volume sits AFTER the compressor so the slider really changes the loudness)
    var pre=ctx.createGain();
    var comp=ctx.createDynamicsCompressor();
    master=ctx.createGain();master.gain.value=level();
    pre.connect(comp);comp.connect(master);master.connect(ctx.destination);

    verb=makeReverb();var wet=ctx.createGain();wet.gain.value=0.9;verb.connect(wet);wet.connect(pre);
    ctx._dry=dry;
  }
  // one bowed note
  function note(midi,t,dur,vol,cut,vibDepth,attack){
    var f=hz(midi),end=t+dur;

    out.gain.setValueAtTime(0.0001,t);

  var lastIdx=4;

  });

  // mute button (top-left of the main menu)
  var btn=document.createElement('button');
  btn.className='mutebtn';btn.type='button';
  btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="wave" d="M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg>';
  function paint(){

    var l=muted?(ru?'Включить музыку':'Turn music on'):(ru?'Выключить музыку':'Turn music off');

  var wrap=document.createElement('div');wrap.className='volsl';
  var sl=document.createElement('input');sl.type='range';sl.min='0';sl.max='100';sl.step='1';sl.value=String(Math.round(vol*100));
  var vl=ru?'Громкость музыки':'Music volume';sl.setAttribute('aria-label',vl);sl.title=vl;

    vol=sl.value/100;

  });

  wrap.appendChild(sl);document.body.appendChild(wrap);paintSl();
  function sync(){
    var mod=document.getElementById('modal');
    var on=!!document.querySelector('.splash')&&!(mod&&mod.innerHTML.trim());
    btn.classList.toggle('show',on);wrap.classList.toggle('show',on);
  }
  var mo=new MutationObserver(sync);
  mo.observe(document.getElementById('app'),{childList:true});
  mo.observe(document.getElementById('modal'),{childList:true,subtree:true,characterData:true});
  setTimeout(sync,0);setTimeout(sync,300);
})();
</script>
