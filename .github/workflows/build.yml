name: Build Windows

on:
  workflow_dispatch:      # ручной запуск кнопкой
  push:
    branches: [main]      # и автоматически при каждой загрузке файлов

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Установка зависимостей
        run: npm install
      - name: Шрифты
        run: npm run fonts
      - name: Сборка
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # без подписи кода
      - name: Сохранить результат
        uses: actions/upload-artifact@v4
        with:
          name: DUMA-windows
          path: |
            dist/*.exe
